# Project-wide active alt-moveset opponent variants.
#
# Auto-merged onto every opponent pool by deep_dive.py unless the dive
# is invoked with --no-active-variants. Each [[variants]] entry adds a
# new opponent only if its base species is already in the loaded pool,
# so a GL-only variant skips silently on UL pools.
#
# Schema (per entry):
#   species   = "Forretress"   # PvPoke speciesName, base form (no shadow suffix)
#   shadow    = true           # optional, default false
#   fast      = "BUG_BITE"     # optional fast-move ID override
#   charged   = ["A", "B"]     # optional charged-move ID list override
#   note      = "..."          # free-form, ignored by the loader
#
# At least one of fast / charged is required; defaults come from PvPoke
# rankings for the (species, shadow) combo. Display name is auto-generated:
#
#   Forretress | fast=BUG_BITE             -> 'Forretress (Bug Bite)'
#   Forretress (Shadow) | fast=BUG_BITE    -> 'Forretress (Shadow) (Bug Bite)'
#
# To toggle a variant off without losing the entry, comment its block.
# To toggle the whole file off for a single dive: --no-active-variants.

# REMOVED 2026-09-10 (pre-dive input-freshness lens):
#
#   Cradily (ACID), Quagsire and Quagsire (Shadow) (AQUA_TAIL/STONE_EDGE)
#     -- these variants now DUPLICATE PvPoke's default moveset for the same
#     species, so the dive loaded each of them TWICE under two display names
#     ("Cradily" and "Cradily (Acid)") with byte-identical results. That
#     double-weights the species in every per-opponent aggregate, and the
#     Tinkaton pre-dive page shows it plainly: both rows read
#     mean_delta=+0.54 spread=2.33 n=2505. The alt moveset is not lost --
#     it IS the default now, so the base pool entry covers it.
#
#   Primeape x2 -- the species is in neither the GL nor the UL pool, so the
#     loader skipped them silently. Dead weight.
#
# Kept: Forretress (BUG_BITE) and Annihilape (CLOSE_COMBAT/RAGE_FIST), both
# still genuinely different from the current default.

[[variants]]
species = "Forretress"
fast = "BUG_BITE"
note = "Bug Bite is a CS-meta fast-move alternative to Volt Switch (e.g. for the Galarian Corsola GL dive 2026-04-26)."

[[variants]]
species = "Forretress"
shadow = true
fast = "BUG_BITE"
note = "Shadow Forretress also has a meta-relevant Bug Bite variant; see the four shipped Forretress dive HTMLs."

# --- CS-2026 tournament moveset corrections (audit 2026-06-12) ---
# Field-dominant or near-majority sets our pool never simmed. The five
# smaller splits from the same audit (Furret, Talonflame, Ninetales-S,
# Sableye, Weezing-G-S, 25-37% shares) are listed in
# userdata/moveset_pool_audit_2026-06-12.html pending per-stanza review.

[[variants]]
species = "Annihilape"
charged = ["CLOSE_COMBAT", "RAGE_FIST"]
note = "CS 2026 field: 59% of 29 Annihilape entries across 7 events run Low Kick + Close Combat / Rage Fist (moveset pool audit 2026-06-12)."

