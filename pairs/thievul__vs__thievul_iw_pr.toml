# Thievul (NS+IW) vs Thievul (IW+PR) -- generated by scripts/joint_iv_from_worlds.py
# from worlds/meta.toml (movesets = the Worlds-baked movesets, so the
# Tier-2 cross-check applies). Edit freely; the generator never overwrites
# without --force.

[pair]
league = "great"
focal = "Thievul"
focal_shadow = false
focal_slug = "thievul"
opponent = "Thievul"
opponent_shadow = false
opponent_slug = "thievul_iw_pr"
opponent_fast = "SUCKER_PUNCH"
opponent_charged = ["ICY_WIND", "PLAY_ROUGH"]
data_dir = "userdata/joint_iv/thievul__vs__thievul_iw_pr"
injected_moves = ["ICY_WIND"]
replay_blob = "userdata/replay/20260815_183454_Thievul_great.replay.pkl.gz"
opponent_injected_moves = ["ICY_WIND"]

# FROZEN SLOT KEYS -- the page JS locates the breakpoints layer by
# these historical spellings (thievul=focal slot, lickitung=opp
# slot, licki=opp shorthand); they are slot names, not species.
# The page builder hard-aborts when breakpoints.json lacks them.
[breakpoints]
focal_key = "thievul"
opp_key = "lickitung"
opp_short = "licki"
# The OPPONENT worlds modal moveset deliberately differs from
# PvPoke's rankings default (see the focal note above for the
# same rule).
assert_opponent_default_moveset = false

[[grids]]
label = "iwns_bait"
focal_fast = "SUCKER_PUNCH"
focal_charged = ["ICY_WIND", "NIGHT_SLASH"]
bait = true

[[grids]]
label = "iwns_nobait"
focal_fast = "SUCKER_PUNCH"
focal_charged = ["ICY_WIND", "NIGHT_SLASH"]
bait = false

# Cross-arm head-to-head: same species, DIFFERENT second charged move --
# not a true mirror (diagonal cells are real fights). Display labels
# disambiguate the two arms.
[page]
focal_display = "Thievul (NS+IW)"
opp_display = "Thievul (IW+PR)"
