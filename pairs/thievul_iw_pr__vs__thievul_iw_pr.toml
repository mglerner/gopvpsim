# Thievul (IW+PR) vs Thievul (IW+PR) -- generated by scripts/joint_iv_from_worlds.py
# from worlds/meta.toml (movesets = the Worlds-baked movesets, so the
# Tier-2 cross-check applies). Edit freely; the generator never overwrites
# without --force.

[pair]
league = "great"
focal = "Thievul"
focal_shadow = false
focal_slug = "thievul_iw_pr"
opponent = "Thievul"
opponent_shadow = false
opponent_slug = "thievul_iw_pr"
opponent_fast = "SUCKER_PUNCH"
opponent_charged = ["ICY_WIND", "PLAY_ROUGH"]
data_dir = "userdata/joint_iv/thievul_iw_pr__vs__thievul_iw_pr"
injected_moves = ["ICY_WIND"]
replay_blob = "userdata/replay/20260815_183454_Thievul_great.replay.pkl.gz"
opponent_injected_moves = ["ICY_WIND"]

# FROZEN SLOT KEYS -- the page JS locates the breakpoints layer by
# these historical spellings (thievul=focal slot, lickitung=opp
# slot, licki=opp shorthand); they are slot names, not species.
# The page builder hard-aborts when breakpoints.json lacks them.
[breakpoints]
focal_key = "thievul"
opp_key = "lickitung"
opp_short = "licki"
# The OPPONENT worlds modal moveset deliberately differs from
# PvPoke's rankings default (see the focal note above for the
# same rule).
assert_opponent_default_moveset = false
# The Worlds MODAL moveset (what the field actually runs, ?% of n=?)
# deliberately differs from PvPoke's rankings default -- an
# explicit opt-out of the default-moveset check, never a
# silently absent one.
assert_focal_default_moveset = false

[[grids]]
label = "iwpr_bait"
focal_fast = "SUCKER_PUNCH"
focal_charged = ["ICY_WIND", "PLAY_ROUGH"]
bait = true

[[grids]]
label = "iwpr_nobait"
focal_fast = "SUCKER_PUNCH"
focal_charged = ["ICY_WIND", "PLAY_ROUGH"]
bait = false

[page]
injected_note = 'MOVE LEGALITY: Icy Wind is the 2026-08-16 Community Day exclusive (elite move; not obtainable by regular TM). The pinned bake gamemaster predates the CD, so the move was injected for simulation; PvPoke upstream added it as an elite move on 2026-08-14.'

# Regression pin (review m9): the rank-1 spread's published headline
# W/L/T for the primary arm at pvpoke-IVs / bait / 1-1, read from the
# meta_wins.npz current at first publish. joint_iv_meta --verify fails
# if a re-extraction drifts from this claim.
[meta.oracle]
arm = "iwpr"
oppiv = "pvpoke"
bait = true
scenario = [1, 1]
rank = 1
want_w = 62
want_l = 25
want_t = 1
