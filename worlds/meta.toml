injection_note = "Icy Wind injected: the pinned sim gamemaster predates the Community Day. We sim on pvpoke f60a41199 (gamemaster 8f1d6cca5c0f), the pre-Worlds vintage every other number on this site was baked at, and it still lists Thievul without Icy Wind. Upstream pvpoke added Icy Wind to Thievul as an elite charged move on 2026-08-14 (commit f754cd6fc), so the injected move pool matches current pvpoke exactly -- but the move data itself comes from the pinned gamemaster, where Icy Wind already exists (other species learn it). Nothing else about Thievul is injected: Sucker Punch, Night Slash and Play Rough are all in Thievul's pinned legal pool."

