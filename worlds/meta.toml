badge_rule = ""
forced_reason = "post-CD editorial include (Michael, 2026-08-18): Icy Wind Thievul is Worlds-legal (CD 08-16 precedes Worlds; not on the Play! banned list); PvPoke GL rank ~41; no tournament footprint yet. Exact corpus figures: 1 of 1,801 recent open-GL teams (0.06%), 6 of 3,649 across the whole corpus, 0 of 128 top-cut teams -- and every one of those predates the Community Day, when Thievul had no Icy Wind and sat at PvPoke GL rank 122. Thievul enters the matrix as TWO builds, not one. Both run Sucker Punch + Icy Wind and fork only on the second charged move: Night Slash (PvPoke's post-CD default) or Play Rough (the build the Community Day dive landed on). The choice is genuinely contested, so shipping one row would take a side; both are baked as full entries and every pair between them and the rest of the meta -- including the pair BETWEEN the two arms -- is simmed. Full Night-Slash-vs-Play-Rough treatment: thievul-lickilicky-robustness.html. Which arm is better depends on the METRIC and the MATCHUP, so this page states its own convention rather than a verdict. On the matrix's win-count convention -- summed over all 9 shield scenarios and the 31 shared opponents, 279 cells per slice -- Icy Wind + Play Rough leads on BOTH probe spreads: 167.30 vs 157.85 at the rank-1 stat-product spread and 158.56 vs 149.48 at the max-attack spread (top-512 cohort, baiting on). Night Slash's case rests on three things this count does not capture. (1) BAIT-ROBUSTNESS, which the planes here confirm directly: switching the focal side to no-bait moves Icy Wind + Play Rough by 8.11 and Night Slash by 0.72, so nearly all of Play Rough's margin is bait-dependent. (2) BATTLE RATING rather than win count -- on PvPoke's rating metric, and at 2-2, Night Slash led on the deep analysis's 88-Pokemon pool. (3) The LICKILICKY matchup specifically, for high-stat-product spreads: at 1-1 against the top-512 Lickilicky cohort, the rank-1 Thievul spread beats 512 of 512 with Night Slash and 373 of 512 (72.9%) with Play Rough -- our planes reproduce the deep analysis's figure exactly -- while the SAME matchup flips the other way on the max-attack spread (83 of 512 vs 512 of 512), which is what \"IV-conditional\" means here. The 88-pool win-count and battle-rating numbers come from the linked analysis, not from this matrix; the per-scenario grids below are what this page measures."
